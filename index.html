<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stranded</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="debug-overlay" style="position:fixed;top:0;left:0;z-index:99999;background:#a00;color:#fff;font:12px monospace;padding:6px;max-width:100vw;white-space:pre-wrap;display:none;"></div>
  <script>
    (function () {
      const el = document.getElementById('debug-overlay');
      const devMode = new URLSearchParams(location.search).has('debug');

      function show(msg) { el.style.display = 'block'; el.textContent += msg + '\n'; }

      // Erros sempre visíveis (só aparecem se houver problema)
      window.addEventListener('error', e => show('ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
      window.addEventListener('unhandledrejection', e => show('REJECTION: ' + (e.reason && e.reason.stack || e.reason)));

      // F3 alterna o overlay manualmente (útil em dev sem alterar a URL)
      document.addEventListener('keydown', e => {
        if (e.key === 'F3') {
          e.preventDefault();
          el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }
      });

      // ?debug=1 na URL mostra o overlay logo ao arrancar
      if (devMode) el.style.display = 'block';
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>

</html>
