<!DOCTYPE html>
<html><head>
<style>*{margin:0;padding:0}body{background:#000}canvas{display:block;margin:auto}</style>
</head><body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
<script type="module">
// Interceptar erros
window.onerror = (msg,src,line,col,err) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:8px;font:14px monospace;z-index:9999';
  d.textContent = `ERRO: ${msg} [${src}:${line}]`;
  document.body.prepend(d);
};

import GameScene from './src/scenes/GameScene.js';
import HUDScene  from './src/scenes/HUDScene.js';

const FW=96, FH=64;
const pH='assets/spritesheets/human/';
const pG='assets/spritesheets/goblin/';

class QuickLoad extends Phaser.Scene {
  constructor(){ super('QuickLoad'); }
  preload(){
    this.add.text(10,10,'A carregar...',{fill:'#fff',fontSize:'20px'});
    this.load.image('sunnyside','assets/tilesets/spr_tileset_sunnysideworld_16px.png');
    this.load.tilemapTiledJSON('ilha','assets/tilemaps/ilha.json');
    const ss = (k,f,n=1) => this.load.spritesheet(k,pH+f,{frameWidth:FW,frameHeight:FH});
    const sg = (k,f) => this.load.spritesheet(k,pG+f,{frameWidth:FW,frameHeight:FH});
    ss('player_base_idle','base_idle_strip9.png');
    ss('player_base_walk','base_walk_strip8.png');
    ss('player_base_run','base_run_strip8.png');
    ss('player_base_hurt','base_hurt_strip8.png');
    ss('player_base_death','base_death_strip13.png');
    ss('player_base_axe','base_axe_strip10.png');
    ss('player_base_mining','base_mining_strip10.png');
    ss('player_hair_idle','mophair_idle_strip9.png');
    ss('player_hair_walk','mophair_walk_strip8.png');
    ss('player_hair_run','mophair_run_strip8.png');
    ss('player_hair_hurt','mophair_hurt_strip8.png');
    ss('player_hair_death','mophair_death_strip13.png');
    ss('player_hair_axe','mophair_axe_strip10.png');
    ss('player_hair_mining','mophair_mining_strip10.png');
    ss('player_tools_idle','tools_idle_strip9.png');
    ss('player_tools_walk','tools_walk_strip8.png');
    ss('player_tools_run','tools_run_strip8.png');
    ss('player_tools_hurt','tools_hurt_strip8.png');
    ss('player_tools_axe','tools_axe_strip10.png');
    ss('player_tools_mining','tools_mining_strip10.png');
    sg('goblin_idle','spr_idle_strip9.png');
    sg('goblin_walk','spr_walk_strip8.png');
    sg('goblin_hurt','spr_hurt_strip8.png');
    sg('goblin_death','spr_death_strip13.png');
    sg('goblin_attack','spr_attack_strip10.png');
    ['wood','rock','fish','egg','milk','water','axe','pickaxe','hammer','shovel','sword',
     'itemdisc_01','itemdisc_02','indicator',
     'greenbar_00','greenbar_06','redbar_00','redbar_06','bluebar_00','bluebar_05'
    ].forEach(k=>this.load.image(k,`assets/images/${k}.png`));
    ['carrot','potato','wheat'].forEach(k=>this.load.image(k,`assets/images/${k}_00.png`));
    this.load.on('loaderror',(f)=>console.error('LOAD ERR:',f.key,f.src));
  }
  create(){ this.scene.start('GameScene'); }
}

new Phaser.Game({
  type: Phaser.AUTO,
  scale:{ mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH, width:960, height:640 },
  backgroundColor:'#1a1a2e',
  physics:{ default:'arcade', arcade:{ gravity:{y:0}, debug:false } },
  scene:[ QuickLoad, GameScene, HUDScene ]
});
</script>
</body></html>
